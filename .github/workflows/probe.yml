   name: Probe API
   on:
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     probe:
       runs-on: ubuntu-latest
       timeout-minutes: 60
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: Probe
           env:
             BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
             BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
             REGION: eu
             RULESET: "15"
             HOUSE: "123"
           run: python probe_api.py
         - name: Publish to probe branch
           run: |
             git config user.name "ah-bot"
             git config user.email "ah-bot@users.noreply.github.com"
             git checkout --orphan probe
             git rm -rf --cached . > /dev/null
             git add -f data
             git commit -m "probe $(date -u +%Y-%m-%dT%H:%MZ)"
             git push -f origin probe
