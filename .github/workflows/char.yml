name: Character
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  char:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python char_pull.py
      - run: |
          git config user.name "ah-bot"; git config user.email "ah-bot@users.noreply.github.com"
          git checkout --orphan char; git rm -rf --cached . > /dev/null; git add -f data/char.json
          git commit -qm "char $(date -u +%Y-%m-%dT%H:%MZ)"; git push -f origin char
