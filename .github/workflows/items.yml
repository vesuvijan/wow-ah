name: Item database crawl
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Baslangic item ID"
        required: true
        default: "1"
      end:
        description: "Bitis item ID"
        required: true
        default: "25000"
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl items
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: eu
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python items_crawl.py
      - name: Publish to items branch (keeps previous chunks)
        run: |
          git config user.name "ah-bot"
          git config user.email "ah-bot@users.noreply.github.com"
          mkdir -p /tmp/keep
          git fetch --depth=1 origin items && git archive FETCH_HEAD data | tar -x -C /tmp/keep || true
          cp -n /tmp/keep/data/*.json data/ 2>/dev/null || true
          git checkout --orphan items
          git rm -rf --cached . > /dev/null
          git add -f data
          git commit -m "items ${{ inputs.start }}-${{ inputs.end }}"
          git push -f origin items
