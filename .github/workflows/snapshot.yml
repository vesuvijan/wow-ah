name: Snapshot AH
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Discord'a test mesaji gonder"
        type: boolean
        default: false
      loop:
        description: "Kendini 15 dk sonra tekrar tetikle (zincir)"
        type: boolean
        default: false
      force:
        description: "Veri degismese de calistir (tek seferlik)"
        type: boolean
        default: false
      wait:
        description: "Baslamadan once beklenecek saniye"
        type: string
        default: "0"
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: snapshot-${{ inputs.loop && 'loop' || github.run_id }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait before starting (chain mode)
        if: ${{ inputs.wait != '' && inputs.wait != '0' }}
        run: sleep ${{ inputs.wait }}
      - name: Queue the next run (chain mode, retries; schedule = watchdog restarts a dead chain)
        if: ${{ inputs.loop || github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list --workflow snapshot.yml --json status,databaseId -q "[.[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\") and .databaseId != ${{ github.run_id }})] | length")
            if [ "$n" != "0" ]; then echo "chain alive ($n active)"; exit 0; fi
            echo "chain dead, restarting"
          fi
          for i in 1 2 3 4 5 6; do
            gh workflow run snapshot.yml --ref main -f loop=true -f wait=180 && exit 0
            echo "dispatch failed, retry $i"; sleep $((i * 20))
          done
          echo "::warning::could not queue next run"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AH data
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: eu
          RULESET: "15"
          HOUSES: "123"
        run: python fetch_ah.py
      - name: Restore history and item names
        run: |
          git fetch --depth=1 origin snapshot && for f in history.csv alert_state.json last_hash.txt report.txt minhist.json tipcache.json known_items.json alert_log.jsonl writ_prev.json; do git show FETCH_HEAD:data/$f > data/$f 2>/dev/null || true; done || true
          git fetch --depth=1 origin ahledger && git show FETCH_HEAD:data/ahl_forever.rppvp.alliance.eu.json > data/ahl.json 2>/dev/null || true
          git fetch --depth=1 origin probe && git show FETCH_HEAD:data/names.json > data/names.json 2>/dev/null && git show FETCH_HEAD:data/recipes_static-forever-eu.json > data/recipes.json 2>/dev/null || true
      - name: History, report and Discord alerts
        env:
          HOUSES: "123"
          FORCE: ${{ inputs.force && '1' || '' }}
          NTFY_TOPIC: docker-ah-f53611966a
          SITE_URL: https://vesuvijan.github.io/wow-ah/
        run: python history.py
      - name: Discord test message
        if: ${{ inputs.test_discord }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "import alerts, json; alerts.demo()"
      - name: Fetch all Forever markets (EU + US)
        continue-on-error: true
        timeout-minutes: 10
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          ALL_MARKETS: "1"
        run: python fetch_ah.py
      - name: Fonts (JetBrains Mono Nerd Font)
        uses: actions/cache@v4
        id: fontcache
        with:
          path: site/fonts
          key: jbm-nerd-3.2.1
      - name: Download fonts
        if: steps.fontcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p site/fonts && curl -sSL -o /tmp/jbm.zip https://github.com/ryanoasis/nerd-fonts/releases/download/v3.2.1/JetBrainsMono.zip
          unzip -o -q /tmp/jbm.zip JetBrainsMonoNerdFont-Regular.ttf JetBrainsMonoNerdFont-Bold.ttf -d site/fonts
      - name: Build dashboard
        env:
          NTFY_TOPIC: docker-ah-f53611966a
        run: python site_build.py
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish to snapshot branch
        run: |
          rm -rf data/names.json data/recipes.json data/ahl.json data/markets
          git config user.name "ah-bot"
          git config user.email "ah-bot@users.noreply.github.com"
          git checkout --orphan snapshot
          git rm -rf --cached . > /dev/null
          git add -f data
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin snapshot
  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: d
        uses: actions/deploy-pages@v4
