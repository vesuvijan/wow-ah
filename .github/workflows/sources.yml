name: Loot sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl journal
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: eu
        run: python sources_crawl.py
      - name: Publish to sources branch
        run: |
          git config user.name "ah-bot"
          git config user.email "ah-bot@users.noreply.github.com"
          git checkout --orphan sources
          git rm -rf --cached . > /dev/null
          git add -f data
          git commit -m "sources"
          git push -f origin sources
