name: Tooltip probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Try tooltip endpoints
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          i=0
          for u in \
            "https://nether.wowhead.com/forever/tooltip/item/9921" \
            "https://nether.wowhead.com/forever/tooltip/item/9921?bonus=12688" \
            "https://nether.wowhead.com/forever/tooltip/item/9921?bonus=12689" \
            "https://nether.wowhead.com/forever/tooltip/item/9921?rand=-12" \
            "https://nether.wowhead.com/forever/tooltip/item/9921?rand=-12&ilvl=45" ; do
            i=$((i+1)); code=$(curl -sSL -m 40 -A "$UA" "$u" -o data/wh_$i.txt -w "%{http_code} %{size_download}" || echo fail)
            echo "$i $code $u"; python3 -c "import json,re,sys;d=json.load(open('data/wh_$i.txt'));t=d['tooltip'];print(d['name'],re.findall(r'<!--stat\\d+-->[^<]+',t),'Random' in t)" || true
          done
      - name: Publish
        run: |
          git config user.name "ah-bot"; git config user.email "ah-bot@users.noreply.github.com"
          git checkout --orphan whprobe; git rm -rf --cached . > /dev/null; git add -f data; git commit -qm wh; git push -f origin whprobe
