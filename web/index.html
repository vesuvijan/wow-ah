<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Docker's AH Desk</title>
<meta name="theme-color" content="#0f1311">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23e3b341'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' font-family='monospace' fill='%230f1311'%3Eg%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:"JBNerd";src:url("fonts/JetBrainsMonoNerdFont-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"JBNerd";src:url("fonts/JetBrainsMonoNerdFont-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{
  --bg:#0f1311;--panel:#161b18;--panel2:#1d2420;--line:#2a332d;--fg:#dfe6e1;--mute:#8a978e;--dim:#5d6a61;
  --gold:#e3b341;--silver:#b8c2cc;--copper:#c9824f;
  --up:#4cc38a;--down:#5aa9ff;--warn:#f0a646;--bad:#ff7b72;--acc:#e3b341;
  --q0:#9d9d9d;--q1:#e6e6e6;--q2:#3fd35b;--q3:#3d8cff;--q4:#b65cff;--q5:#ff8000;
  --font:"JBNerd","JetBrainsMono Nerd Font","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f1e8;--panel:#fffdf7;--panel2:#efe9da;--line:#dcd3bf;--fg:#22251f;--mute:#6b6a5c;--dim:#9a9684;
  --gold:#a77a07;--silver:#5d6b78;--copper:#9a5524;--up:#13824d;--down:#1d63c4;--warn:#a85f00;--bad:#c0362c;--acc:#a77a07;
  --q0:#7a7a7a;--q1:#3a3a3a;--q2:#16862a;--q3:#1e5fc4;--q4:#8a2fd0;--q5:#c25f00;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f1e8;--panel:#fffdf7;--panel2:#efe9da;--line:#dcd3bf;--fg:#22251f;--mute:#6b6a5c;--dim:#9a9684;
  --gold:#a77a07;--silver:#5d6b78;--copper:#9a5524;--up:#13824d;--down:#1d63c4;--warn:#a85f00;--bad:#c0362c;--acc:#a77a07;
  --q0:#7a7a7a;--q1:#3a3a3a;--q2:#16862a;--q3:#1e5fc4;--q4:#8a2fd0;--q5:#c25f00;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13.5px;line-height:1.5;
  padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding-block:10px}
.row{flex-wrap:nowrap}
.brand{font-weight:700;letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.brand .ic{color:var(--gold);font-size:18px}
.age{color:var(--mute);font-size:12px}
.age b{color:var(--fg);font-weight:400}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:middle}
.dot.stale{background:var(--warn)}.dot.dead{background:var(--bad)}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.on{border-color:var(--up);color:var(--up)}
.btn.sm{padding:2px 7px;font-size:12px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav a{padding:8px 12px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--fg);border-color:var(--acc)}
nav a:hover{text-decoration:none;color:var(--fg)}
main{padding-block:18px}
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700}
.muted{color:var(--mute)}.dim{color:var(--dim)}
.g{color:var(--gold)}.s{color:var(--silver)}.c{color:var(--copper)}
.money{white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;color:var(--mute);background:transparent}
.chip.on{color:var(--fg);border-color:var(--acc);background:var(--panel2)}
.feed-run{margin-bottom:16px}
.run-h{color:var(--mute);font-size:12px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.run-h::after{content:"";flex:1;border-top:1px dashed var(--line)}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-left:3px solid var(--k,var(--line));border-radius:6px;background:var(--panel);margin-bottom:6px}
.alert.new{box-shadow:0 0 0 1px var(--acc) inset}
.alert.done{opacity:.42}
.alert .tag{font-weight:700;font-size:11.5px;color:var(--k);white-space:nowrap;min-width:72px}
.alert .txt{min-width:0;overflow-wrap:anywhere}
.k-sell{--k:var(--up)}.k-dip{--k:var(--down)}.k-gear{--k:var(--q4)}.k-snipe{--k:var(--warn)}.k-flip{--k:var(--gold)}
.k-favor{--k:var(--gold)}.k-writ{--k:var(--q3)}.k-gamble{--k:var(--bad)}.k-mat{--k:var(--silver)}
.status li{margin-bottom:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:400;font-size:12px;white-space:nowrap}
td.r,th.r{text-align:right}
tr.mine td{background:var(--panel2)}
.tbl{overflow-x:auto}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.search input:focus{outline:none;border-color:var(--acc)}
.res a{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:7px 10px;border-bottom:1px solid var(--line);color:var(--fg)}
.res a:hover{background:var(--panel2);text-decoration:none}
.item-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.item-h h1{margin:0;font-size:20px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.kv div{background:var(--panel2);border-radius:6px;padding:8px 10px}
.kv i{display:block;font-style:normal;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-weight:400;font-size:15px}
.chart{width:100%;height:220px;display:block}
.chart text{fill:var(--mute);font-size:10.5px;font-family:var(--font)}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:1.6}
.chart .ar{fill:var(--acc);opacity:.08}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hv{stroke:var(--mute);stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap}
.rel{position:relative}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.two{grid-template-columns:3fr 2fr}}
.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:110px}
.empty{color:var(--mute);padding:18px;text-align:center}
.q0{color:var(--q0)}.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}.q4{color:var(--q4)}.q5{color:var(--q5)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel2);border:1px solid var(--acc);border-radius:8px;padding:10px 14px;z-index:20;max-width:min(420px,calc(100vw - 32px))}
details summary{cursor:pointer;color:var(--mute)}
.feedbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.feedbar .row{flex-wrap:wrap}
.jump .chip{font-size:12px}
.cat-h{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}.cat-h h2{margin:0}
td.small,.small{font-size:12px}
tr.done td{opacity:.4}tr.gone td{opacity:.5}
.side{align-content:start}
.stat-line{padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
@media(min-width:900px){.two{grid-template-columns:minmax(0,3fr) minmax(0,1.3fr)}}
code{background:var(--panel2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand"><span class="ic">&#xf0d6;</span> Docker's AH Desk <span class="pill">RP-PvP · Alliance · EU</span></div>
    <div class="age" id="age"><span class="dot"></span>loading…</div>
    <div class="spacer"></div>
    <div class="row"><button class="btn" id="notif">&#xf0f3; Alerts</button><button class="btn" id="theme" title="Theme">&#xf186;</button></div>
  </div>
  <div class="wrap"><nav id="nav">
    <a href="#feed">&#xf0e7; Opportunities</a>
    <a href="#search">&#xf002; Search</a>
    <a href="#char">&#xf007; Character</a>
    <a href="#db">&#xf1c0; Item DB</a>
    <a href="#bank">&#xf19c; Bank</a>
    <a href="#watch">&#xf06e; Watchlist</a>
    <a href="#plans">&#xf0c3; Professions</a>
    <a href="#setup">&#xf013; Settings</a>
  </nav></div>
</header>
<main class="wrap" id="view"><div class="empty">Loading…</div></main>
<div class="tip" id="tip" hidden></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("ahd." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ahd." + k, JSON.stringify(v)); } catch {} }
};
const S = { meta: null, now: null, feed: null, bank: null, plans: null, names: null, x: null, hist: null };
const KIND = {
  sell: ["&#xf062; SELL", "Sell"], dip: ["&#xf063; BUY MORE", "Dip"], gear: ["&#xf132; GEAR", "Gear"], snipe: ["&#xf0e7; SNIPE", "Snipe"],
  flip: ["&#xf021; FLIP", "Flip"], favor: ["&#xf005; FAVOR", "Favor"], writ: ["&#xf15c; WRIT", "Writ"], gamble: ["&#xf128; GAMBLE", "Writ gamble"], mat: ["&#xf07a; MAT", "Mat"]
};

// ---------- para
function money(c, plain) {
  if (c == null || isNaN(c)) return '<span class="dim">–</span>';
  c = Math.round(c); const neg = c < 0; c = Math.abs(c);
  const g = Math.floor(c / 10000), s = Math.floor(c / 100) % 100, k = c % 100;
  if (plain) return (neg ? "-" : "") + (g ? g + "g " : "") + (g || s ? s + "s " : "") + k + "c";
  let o = "";
  if (g) o += `${g}<span class="g">g</span> `;
  if (g || s) o += `${s}<span class="s">s</span> `;
  if (!g) o += `${k}<span class="c">c</span>`;
  return `<span class="money">${neg ? "-" : ""}${o.trim()}</span>`;
}
function parseMoney(t) {
  t = String(t).trim().toLowerCase().replace(",", "."); if (!t) return null;
  let c = 0, m, any = false;
  for (const [re, mul] of [[/([\d.]+)\s*g/, 10000], [/([\d.]+)\s*s/, 100], [/([\d.]+)\s*c/, 1]]) if ((m = t.match(re))) { c += parseFloat(m[1]) * mul; any = true; }
  if (!any && /^[\d.]+$/.test(t)) c = parseFloat(t) * 100; // sade sayi = silver
  return Math.round(c) || null;
}
const pct = (a, b) => (a == null || !b) ? null : Math.round(100 * a / b - 100);
const pctHtml = p => p == null ? '<span class="dim">–</span>' : `<span class="${p > 0 ? "up" : p < 0 ? "down" : "muted"}">${p > 0 ? "+" : ""}${p}%</span>`;
const tr = ts => { const d = new Date(ts.endsWith("Z") ? ts : ts + "Z"); return d; };
const fmtTime = d => d.toLocaleTimeString("tr-TR", {hour: "2-digit", minute: "2-digit", timeZone: "Europe/Istanbul"});
const fmtDay = d => d.toLocaleDateString("tr-TR", {day: "numeric", month: "short", weekday: "short", timeZone: "Europe/Istanbul"});
const qcls = q => { const m = {POOR:0,COMMON:1,UNCOMMON:2,RARE:3,EPIC:4,LEGENDARY:5}; const v = typeof q === "number" ? q : m[String(q || "").toUpperCase()]; return v == null ? "" : "q" + v; };

// ---------- veri
async function getJSON(p) { const r = await fetch(`data/${p}?v=${Date.now()}`, {cache: "no-store"}); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }
async function loadCore() {
  const [meta, now, feed, bank, plans, names] = await Promise.all(["meta.json", "now.json", "feed.json", "bank.json", "plans.json", "names.json"].map(getJSON));
  Object.assign(S, {meta, now, feed, bank, plans, names});
  S.byName = {}; for (const [id, n] of Object.entries(names)) S.byName[n.toLowerCase()] = id;
  S.x = null; S.hist = null;
}
async function loadBig() {
  if (!S.x) S.x = await getJSON("x.json");
  if (!S.hist) S.hist = await getJSON("hist.json");
}

// ---------- ust bar
function renderAge() {
  const el = $("#age"); if (!S.meta) return;
  const d = tr(S.meta.fetched), mins = Math.round((Date.now() - d) / 60000);
  const cls = mins > 150 ? "dead" : mins > 80 ? "stale" : "";
  el.innerHTML = `<span class="dot ${cls}"></span>AH data <b>${fmtTime(d)}</b> (${mins} min ago) · ${S.meta.items} items · ${S.meta.markets} markets · Blizzard updates hourly`;
}

// ---------- router
const VIEWS = {feed: vFeed, search: vSearch, bank: vBank, watch: vWatch, plans: vPlans, setup: vSetup, char: vChar, db: vDB};
function route() {
  const h = (location.hash || "#feed").slice(1);
  const [name, arg] = h.startsWith("item-") ? ["search", h.slice(5)] : [h, null];
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + name));
  (VIEWS[name] || vFeed)(arg);
  window.scrollTo(0, 0);
}

// ---------- opportunities
const M = t => parseMoney(String(t || "").replace(/^~/, "")) ;
const CATS = [
  {id: "sell", title: "&#xf062; Sell now: price spikes", hint: "Price is well above its usual level. List what you hold.", kinds: ["sell"],
   cols: ["Item", "Alert price", "Normal", "Change", "Listed", "You hold", "Live now"],
   row: r => [M(r[1]), M(r[2]), r[3], r[4], hold(r[5])], live: "up"},
  {id: "dip", title: "&#xf063; Buy cheap: price dips", hint: "Well below its usual price. Good moment to stock up.", kinds: ["dip"],
   cols: ["Item", "Alert price", "Normal", "Change", "Listed", "You hold", "Live now"],
   row: r => [M(r[1]), M(r[2]), r[3], r[4], hold(r[5])], live: "down"},
  {id: "gear", title: "&#xf132; Gear upgrades", hint: "Cheap items that beat what you wear.", kinds: ["gear"],
   cols: ["Item", "Price", "Gain", "Slot", "Stats", "Backup", "Live now"],
   row: r => [M(r[1]), r[2], r[3], r[5], (r[7] || "").replace(/^next cheapest /, "next ")], live: "down"},
  {id: "snipe", title: "&#xf0e7; Snipes", hint: "Listed far below normal. Buy and relist.", kinds: ["snipe"],
   cols: ["Item", "Price", "Qty", "Resell at", "Profit", "", "Live now"],
   row: r => [M(r[1]), r[2], M(r[3]), M(r[4]), ""], live: "down"},
  {id: "flip", title: "&#xf021; Vendor flips", hint: "Buy mats on the AH, craft, sell to a vendor.", kinds: ["flip"],
   cols: ["Recipe", "Mat cost", "Vendor", "Profit", "Profession", "Mats", ""],
   row: r => [M(r[1]), M(r[2]), M(r[3]), r[4], r[5]], live: null},
  {id: "writ", title: "&#xf15c; Reputation: writs", hint: "Azeroth Commerce Authority rep without crafting.", kinds: ["writ", "gamble"],
   cols: ["Writ", "Price", "Rep", "Cost / rep", "Needs", "", "Live now"],
   row: r => [M(r[1]), r[2], r[3], r[4], ""], live: "down"},
  {id: "favor", title: "&#xf005; Merchant's Favor", hint: "Cheapest Favor: buy the crate and the mats, hand in to Marcy Baker.", kinds: ["favor"],
   cols: ["Crate", "Per Favor", "Favor", "Fill with", "Crate price", "Plan", ""],
   row: r => [M(r[1]), r[2], r[3], M(r[4]), r[5]], live: null},
  {id: "mat", title: "&#xf07a; Materials for your routes", hint: "Cheaper than usual and needed for a profession route.", kinds: ["mat"],
   cols: ["Item", "Price", "Normal", "Change", "Listed", "Route needs", "Live now"],
   row: r => [M(r[1]), M(r[2]), String(r[3]).replace("-%", "-") + (String(r[3]).includes("%") ? "" : ""), r[4], r[5]], live: "down"},
];
const hold = t => { const m = String(t || "").match(/hold (\d+): about (.*?) at/); return m ? `${m[1]} (≈ ${m[2].replace(/(\d+)c$/, "").replace(/s$/, "s")})` : "–"; };
const cell = v => typeof v === "number" ? money(v) : (v == null || v === "" ? '<span class="dim">–</span>' : esc(v));
function liveState(a, cat) {
  if (!cat.live || !a.id) return ["", null];
  const it = S.now.items[a.id]; if (!it) return ['<span class="dim">not listed</span>', "gone"];
  const ap = M(a.r[1]); if (!ap) return [money(it.min), null];
  const ok = cat.live === "up" ? it.min >= ap * 0.9 : it.min <= ap * 1.1;
  return [`${money(it.min)} ${ok ? '<span class="up">&#xf00c;</span>' : '<span class="bad" title="price moved">&#xf00d;</span>'}`, ok ? "ok" : "gone"];
}
function vFeed() {
  const done = new Set(LS.get("done", [])), win = LS.get("win", 24), showGone = LS.get("showGone", false);
  const cutoff = Date.now() - win * 3600e3;
  const latest = {};
  for (const a of S.feed.items) { if (tr(a.ts) < cutoff) continue; const k = a.k + "|" + a.item; if (!latest[k] || a.ts > latest[k].ts) latest[k] = a; }
  const all = Object.values(latest);
  let body = "", total = 0;
  const nav = [];
  for (const cat of CATS) {
    let rows = all.filter(a => cat.kinds.includes(a.k)).map(a => { const [lv, st] = liveState(a, cat); return {a, lv, st}; });
    const gone = rows.filter(x => x.st === "gone").length;
    if (!showGone) rows = rows.filter(x => x.st !== "gone");
    rows.sort((x, y) => (y.a.s || 0) - (x.a.s || 0));
    if (!rows.length) continue;
    total += rows.length; nav.push(`<a href="#feed" data-jump="${cat.id}" class="chip on">${cat.title.replace(/&#x[0-9a-f]+;\s*/, "")} ${rows.length}</a>`);
    const cols = cat.cols.filter(c => c !== "");
    body += `<section class="card cat" id="cat-${cat.id}"><div class="cat-h"><h2>${cat.title}</h2><span class="muted">${cat.hint}${gone && !showGone ? ` · ${gone} expired hidden` : ""}</span></div><div class="tbl"><table>
      <tr>${cols.map((c, i) => `<th class="${i && i < cols.length && !["Stats", "Mats", "Fill with", "Plan", "Needs", "Profession", "Slot", "Backup"].includes(c) ? "r" : ""}">${c}</th>`).join("")}<th>Seen</th><th></th></tr>`;
    for (const {a, lv, st} of rows) {
      const vals = cat.row(a.r), isDone = done.has(doneKey(a));
      const name = a.id ? `<a href="#item-${a.id}" class="${qcls(S.now.items[a.id]?.q)}">${esc(a.item)}</a>` : esc(a.item);
      const tds = [name, ...vals.map((v, i) => { const c = cat.cols[i + 1]; return c === "" ? null : `<td class="${["Stats", "Mats", "Fill with", "Plan", "Needs", "Profession", "Slot", "Backup"].includes(c) ? "small" : "r"}">${c === "Change" || c === "Gain" ? chg(v) : cell(v)}</td>`; }).filter(Boolean)];
      if (cat.live) tds.push(`<td class="r">${lv}</td>`);
      const d = tr(a.ts);
      body += `<tr class="${isDone ? "done" : ""} ${st === "gone" ? "gone" : ""}" title="${esc(a.t)}"><td>${tds[0]}</td>${tds.slice(1).join("")}<td class="muted small">${ago(d)}</td><td><button class="btn sm" data-done="${esc(doneKey(a))}" title="Mark done">${isDone ? "&#xf0e2;" : "&#xf00c;"}</button></td></tr>`;
    }
    body += `</table></div></section>`;
  }

async function loadDB() {

const SLOTS = [["HEAD","Head",["HEAD"]],["NECK","Neck",["NECK"]],["SHOULDER","Shoulder",["SHOULDER"]],["BACK","Back",["BACK"]],["CHEST","Chest",["CHEST"]],
  ["WRIST","Wrist",["WRIST"]],["HANDS","Hands",["HANDS"]],["WAIST","Waist",["WAIST"]],["LEGS","Legs",["LEGS"]],["FEET","Feet",["FEET"]],
  ["FINGER_1","Ring 1",["FINGER"]],["FINGER_2","Ring 2",["FINGER"]],["TRINKET_1","Trinket 1",["TRINKET"]],["TRINKET_2","Trinket 2",["TRINKET"]],
  ["MAIN_HAND","Main-hand",["MH","1H","2H"]],["OFF_HAND","Off-hand",["1H","OH"]],["RANGED","Ranged",["RANGED"]]];
const STATRE = [[/([+-]?\d+)\s*(agi|agility)/i,"agi"],[/([+-]?\d+)\s*(str|strength)/i,"str"],[/([+-]?\d+)\s*(sta|stamina)/i,"sta"],[/([+-]?\d+)\s*(int|intellect)/i,"int"],
  [/([+-]?\d+)\s*(spi|spirit)/i,"spi"],[/([+-]?\d+)\s*(ranged ap|rap)/i,"rap"],[/([+-]?\d+)\s*(ap|attack power)\b/i,"ap"],[/([\d.]+)%?\s*crit/i,"crit"],[/([\d.]+)%?\s*hit/i,"hit"],
  [/([\d.]+)\s*dps/i,"dps"],[/([+-]?\d+)\s*armor/i,"armor"],[/([+-]?\d+)\s*(mp5|mana)/i,"mp5"]];
function statValue(txt, slot) {
  const w = S.db.w || {}; let v = 0, t = String(txt);
  for (const [re, k] of STATRE) { const m = t.match(re); if (!m) continue; t = t.replace(m[0], " ");
    const x = parseFloat(m[1]); if (k === "dps") v += x * (slot === "OFF_HAND" ? (w.dpsoh || 12) : slot === "RANGED" ? (w.dps || 8) : (w.dpsmelee || 16)); else v += x * (w[k] || 0); }
  return Math.round(v * 10) / 10;
}
function equipped() {
  const ov = LS.get("eq", {}), out = {};
  for (const it of (S.char?.items || [])) out[it.slot] = {id: String(it.id), name: it.name, q: it.quality, src: "armory"};
  for (const [sl, o] of Object.entries(ov)) out[sl] = {...o, src: "manual"};
  for (const [sl, e] of Object.entries(out)) {
    const d = S.db.items[e.id];
    if (e.stats) { e.v = statValue(e.stats, sl); e.st = e.stats; }
    else if (d && !d.rnd) { e.v = sl === "OFF_HAND" && d.vo != null ? d.vo : d.v; e.st = d.st; }
    else { e.v = null; e.st = d ? d.st + " + random suffix (enter stats)" : "not in database (enter stats)"; }
  }
  return out;
}
function candidates(slot, eq, maxReq) {
  const def = SLOTS.find(s => s[0] === slot), ok = new Set(def[2]), other = slot.endsWith("_1") ? eq[slot.replace("_1", "_2")] : slot.endsWith("_2") ? eq[slot.replace("_2", "_1")] : null;
  const cur = eq[slot]?.v ?? 0, out = [];
  for (const [id, d] of Object.entries(S.db.items)) {
    if (!ok.has(d.sl) || d.rq > maxReq || d.rnd || (other && other.id === id) || eq[slot]?.id === id) continue;
    if (slot === "MAIN_HAND" && d.sl === "2H" && eq.OFF_HAND?.id) continue;   // dual wield: 2H aday degil
    if (slot === "MAIN_HAND" && d.sl !== "2H" && !eq.OFF_HAND?.id && S.db.items[eq.MAIN_HAND?.id]?.sl === "2H") continue;
    const v = slot === "OFF_HAND" ? (d.vo ?? d.v) : d.v;
    if (v > cur) out.push([id, d, v]);
  }
  return out.sort((a, b) => b[2] - a[2]);
}

}

  const f = LS.get("dbf", {q: "", sl: "", mx: (S.char?.level || S.db.level) + 5, src: "all"});
  const slots = [...new Set(Object.values(S.db.items).map(d => d.sl))].sort();
  $("#view").innerHTML = `<div class="card"><div class="row" style="margin-bottom:10px">
    <input class="inp" style="width:220px" id="fq" placeholder="name / stat / dungeon" value="${esc(f.q)}">
    <select class="inp" id="fsl"><option value="">all slots</option>${slots.map(s => `<option ${s === f.sl ? "selected" : ""}>${s}</option>`).join("")}</select>
    <span class="muted">max level</span><input class="inp" style="width:60px" id="fmx" type="number" value="${f.mx}">
    <select class="inp" id="fsrc">${Object.entries(SRCF).map(([k, v]) => `<option value="${k}" ${k === f.src ? "selected" : ""}>${v}</option>`).join("")}</select></div><div class="tbl" id="dbt"></div></div>`;
  const draw = () => {
    const q = $("#fq").value.trim().toLowerCase(), sl = $("#fsl").value, mx = +$("#fmx").value || 60, src = $("#fsrc").value;
    LS.set("dbf", {q, sl, mx, src});
    const rows = Object.entries(S.db.items).filter(([id, d]) => (!sl || d.sl === sl) && d.rq <= mx
      && (src === "all" || (src === "ah" ? d.ah : (d.src || []).some(x => x.toLowerCase().startsWith({boss: "drop", quest: "quest", craft: "craft", rep: "rep"}[src]) || (src === "quest" && x.startsWith("Dungeon quest")))))
      && (!q || (d.n + " " + d.st + " " + (d.src || []).join(" ") + " " + d.ty).toLowerCase().includes(q)))
      .sort((a, b) => (b[1].vo ?? b[1].v) - (a[1].vo ?? a[1].v)).slice(0, 250);
    $("#dbt").innerHTML = `<table><tr><th>Item</th><th>Slot</th><th>Type</th><th class="r">Lvl</th><th>Stats</th><th class="r">Value</th><th>Source</th></tr>${rows.map(([id, d]) =>
      `<tr><td><a href="#item-${id}" class="${qcls(d.q)}">${esc(d.n)}</a>${d.rnd ? ' <span class="pill">random</span>' : ""} <span class="dim">${d.b}</span></td><td>${d.sl}</td><td class="muted">${esc(d.ty)}</td><td class="r">${d.rq}</td>
       <td style="font-size:12px">${esc(d.st)}${d.x?.length ? `<div class="muted">${d.x.map(esc).join("<br>")}</div>` : ""}</td><td class="r">${d.vo != null ? `${d.v}<div class="muted" style="font-size:11px">OH ${d.vo}</div>` : d.v}</td><td style="font-size:12px">${srcHtml(d)}</td></tr>`).join("")}</table>
      <p class="muted">${rows.length === 250 ? "Top 250 by value. Narrow the filter." : rows.length + " results."}</p>`;
  };
  ["#fq", "#fsl", "#fmx", "#fsrc"].forEach(s => $(s).oninput = draw); draw();
}

// ---------- grafik
function chart(el, pts) {
  const W = el.clientWidth || 600, H = 220, P = {l: 62, r: 10, t: 10, b: 24};
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const sorted = [...ys].sort((a, b) => a - b), cap = sorted[Math.floor(sorted.length * 0.97)] * 1.15;
  const y0 = 0, y1 = Math.max(1, Math.min(Math.max(...ys), cap));
  const X = v => P.l + (v - x0) / (x1 - x0 || 1) * (W - P.l - P.r), Y = v => H - P.b - (Math.min(v, y1) - y0) / (y1 - y0) * (H - P.t - P.b);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y1 * i / 4, y = Y(v); g += `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text x="${P.l - 6}" y="${y + 3}" text-anchor="end">${money(v, 1).replace(/ 0c$/, "")}</text>`; }
  const days = Math.ceil((x1 - x0) / 24);
  for (let h = Math.ceil(x0 / 24) * 24; h <= x1; h += 24 * Math.max(1, Math.ceil(days / 8))) { const x = X(h); g += `<text x="${x}" y="${H - 6}" text-anchor="middle">${new Date(h * 3600e3).toLocaleDateString("tr-TR", {day: "numeric", month: "short"})}</text>`; }
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history">${g}<path class="ar" d="${d}L${X(x1)},${Y(0)}L${X(x0)},${Y(0)}Z"/><path class="ln" d="${d}"/><line class="hv" id="hv" y1="${P.t}" y2="${H - P.b}" visibility="hidden"/></svg>`;
  const svg = el.querySelector("svg"), tip = $("#tip"), hv = el.querySelector("#hv");
  svg.onpointermove = e => {
    const r = svg.getBoundingClientRect(), xv = x0 + ((e.clientX - r.left) * W / r.width - P.l) / (W - P.l - P.r) * (x1 - x0);
    let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - xv) < Math.abs(best[0] - xv)) best = p;
    hv.setAttribute("x1", X(best[0])); hv.setAttribute("x2", X(best[0])); hv.setAttribute("visibility", "visible");
    const dt = new Date(best[0] * 3600e3);
    tip.innerHTML = `${fmtDay(dt)} ${fmtTime(dt)} · ${money(best[1])}`; tip.hidden = false;
    tip.style.left = Math.min(e.pageX + 12, document.documentElement.clientWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.pageY - 34) + "px";
  };
  svg.onpointerleave = () => { tip.hidden = true; hv.setAttribute("visibility", "hidden"); };
}

// ---------- izleme
function vWatch() {
  const w = LS.get("watch", {}), ids = Object.keys(w);
  const rows = ids.map(id => { const it = S.now.items[id] || {}, hit = it.min != null && it.min <= w[id].t;
    return `<tr><td><a href="#item-${id}">${esc(w[id].n)}</a></td><td class="r">${money(it.min)}</td><td class="r">${it.qty ?? "–"}</td><td class="r">${money(w[id].t)}</td><td>${hit ? '<span class="up">&#xf00c; At target, buy!</span>' : '<span class="muted">waiting</span>'}</td><td><button class="btn sm" data-del="${id}">&#xf00d;</button></td></tr>`; }).join("");
  $("#view").innerHTML = `<div class="card"><h2>&#xf06e; Watchlist</h2>${ids.length ? `<div class="tbl"><table><tr><th>Item</th><th class="r">Now</th><th class="r">Listed</th><th class="r">Target</th><th></th><th></th></tr>${rows}</table></div>` : '<div class="empty">Empty. Search an item and set a target with "Watch".</div>'}
  <p class="muted">Saved in this browser; alerts fire while the page is open. For phone alerts, ask Claude to watch the item.</p></div>`;
  $("#view").onclick = e => { const b = e.target.closest("[data-del]"); if (!b) return; const w2 = LS.get("watch", {}); delete w2[b.dataset.del]; LS.set("watch", w2); vWatch(); };
}

    <div class="kv"><div><i>Materials (current prices)</i><b>${money(p.total)}</b></div><div><i>Back from vendor</i><b>${money(p.back)}</b></div><div><i>Net cost</i><b>${money(p.net)}</b></div></div>

    <div class="two"><div class="tbl"><table><tr><th>Skill</th><th>Recipe</th><th class="r">Crafts</th><th>Mats (per craft)</th></tr>
    ${p.steps.map(s => `<tr><td>${s.range}</td><td>${esc(s.recipe)}</td><td class="r">${s.n}</td><td class="muted">${Object.entries(s.mats).map(([m, q]) => `${q}× ${esc(m)}`).join(", ")}</td></tr>`).join("")}</table></div>
    <div class="tbl"><table><tr><th>Shopping list</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">7d</th><th class="r">Total</th></tr>
    ${p.shop.map(s => { const id = S.byName[s.n.toLowerCase()]; return `<tr><td>${id ? `<a href="#item-${id}">${esc(s.n)}</a>` : esc(s.n)}${s.src === "vendor" ? ' <span class="pill">vendor</span>' : ""}</td><td class="r">${s.qty}${s.got < s.qty && s.src !== "vendor" ? ` <span class="warn">(${s.got})</span>` : ""}</td><td class="r">${money(s.unit)}</td><td class="r">${money(s.m7)}</td><td class="r">${money(s.cost)}</td></tr>`; }).join("")}</table></div></div></div>`).join("")}</div>`;

// ---------- ayarlar
function vSetup() {
  const topic = S.meta.ntfy;
  $("#view").innerHTML = `<div class="grid"><div class="card"><h2>&#xf10b; Phone alerts (ntfy)</h2>
    ${topic ? `<ol><li>Install the <b>ntfy</b> app (App Store / Google Play, free, no account).</li>
    <li>Tap <b>+</b> → topic: <code id="tp">${esc(topic)}</code> <button class="btn sm" id="cp">copy</button> → Subscribe.</li>
    <li>Every new opportunity pings your phone; tapping it opens this page.</li></ol>` : '<p class="muted">Not set up yet.</p>'}</div>
    <div class="card"><h2>&#xf0f3; Browser alerts</h2><p>Alerts for new opportunities and watch targets while this page is open. Status: <b>${"Notification" in window ? Notification.permission : "unsupported"}</b></p></div>
    <div class="card"><h2>&#xf05a; Data</h2><p class="muted">Our AH and every Forever market come from the Blizzard API hourly. Price history since server launch (AHledger archive + our own scans). This page checks for new data every 3 minutes.</p></div></div>`;
  const cp = $("#cp"); if (cp) cp.onclick = () => navigator.clipboard?.writeText(topic).then(() => toast("Copied"), () => toast(topic));
}

// ---------- bildirim & yenileme
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 5000); }
function notify(title, body, tag) { try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, {body, tag}); } catch {} }
function checkNew(prevTs) {
  const fresh = S.feed.items.filter(a => prevTs && a.ts > prevTs);
  if (fresh.length) notify(`${fresh.length} new opportunities`, fresh.slice(0, 4).map(a => a.t).join("\n"), "feed-" + fresh[0].ts);
  const w = LS.get("watch", {}), fired = LS.get("watchFired", {});
  for (const [id, v] of Object.entries(w)) { const it = S.now.items[id];
    if (it && it.min <= v.t && fired[id] !== S.meta.fetched) { notify(`${v.n} at target`, `${money(it.min, 1)} (target ${money(v.t, 1)}), ${it.qty} listed`, "w" + id); fired[id] = S.meta.fetched; } }
  LS.set("watchFired", fired);
}
async function poll() {
  try {
    const m = await getJSON("meta.json");
    if (!S.meta || m.built !== S.meta.built) {
      const prev = S.feed?.items[0]?.ts; await loadCore(); checkNew(prev);
      if (!/^#(search|item-)/.test(location.hash) || !$("#q")) route();
    }
  } catch (e) { console.warn(e); }
  renderAge();
}
function notifBtn() { const b = $("#notif"); const p = "Notification" in window ? Notification.permission : "denied"; b.classList.toggle("on", p === "granted"); b.innerHTML = p === "granted" ? "&#xf0f3; Alerts on" : "&#xf1f6; Alerts off"; }
$("#notif").onclick = async () => { if (!("Notification" in window)) return toast("This browser does not support notifications."); await Notification.requestPermission(); notifBtn(); if (Notification.permission === "granted") notify("Alerts on", "New opportunities will show up here."); };
const th = LS.get("theme", null); if (th) document.documentElement.dataset.theme = th;
$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); const n = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; LS.set("theme", n); };
window.addEventListener("hashchange", route);
(async () => {
  try { await loadCore(); } catch (e) { $("#view").innerHTML = `<div class="empty">Could not load data: ${esc(e.message)}</div>`; return; }
  renderAge(); notifBtn(); route(); checkNew(LS.get("seenTs", ""));
  setInterval(poll, 180000); setInterval(renderAge, 60000);
})();
</script>
