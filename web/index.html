<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AH Desk</title>
<meta name="theme-color" content="#14161a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23d8a83f'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' font-family='monospace' fill='%2314161a'%3Eg%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:"JBNerd";src:url("fonts/JetBrainsMonoNerdFont-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"JBNerd";src:url("fonts/JetBrainsMonoNerdFont-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{
  --bg:#14161a;--sur:#1b1e23;--line:#282c33;--fg:#e6e8ec;--mute:#8d94a0;--dim:#5b616c;
  --acc:#d8a83f;--buy:#6aaef0;--sell:#5fc48f;--up:#5fc48f;--down:#e5746b;--warn:#e0a23a;
  --gold:#d8a83f;--silver:#b4bcc8;--copper:#c98755;
  --q0:#9d9d9d;--q1:#e6e8ec;--q2:#4fcf63;--q3:#4f95ff;--q4:#b56bff;--q5:#ff8c1a;
  --font:"JBNerd","JetBrainsMono Nerd Font","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f6f3;--sur:#ffffff;--line:#e2e2dc;--fg:#1d1f23;--mute:#656b75;--dim:#a3a8b0;
  --acc:#946f0c;--buy:#1f6fc9;--sell:#14804e;--up:#14804e;--down:#c23b30;--warn:#a86400;
  --gold:#946f0c;--silver:#5f6b78;--copper:#99561f;
  --q0:#7a7a7a;--q1:#1d1f23;--q2:#16862a;--q3:#1e5fc4;--q4:#8a2fd0;--q5:#c25f00;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f6f3;--sur:#ffffff;--line:#e2e2dc;--fg:#1d1f23;--mute:#656b75;--dim:#a3a8b0;
  --acc:#946f0c;--buy:#1f6fc9;--sell:#14804e;--up:#14804e;--down:#c23b30;--warn:#a86400;
  --gold:#946f0c;--silver:#5f6b78;--copper:#99561f;
  --q0:#7a7a7a;--q1:#1d1f23;--q2:#16862a;--q3:#1e5fc4;--q4:#8a2fd0;--q5:#c25f00;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;padding-bottom:max(56px,env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}
a:hover{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:14px;padding-block:12px 8px}
.brand{font-weight:700;white-space:nowrap}
.brand i{font-style:normal;color:var(--acc);margin-right:8px}
.find{position:relative;flex:1;min-width:0;max-width:440px}
.find input{width:100%;background:var(--sur);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.find input::placeholder{color:var(--dim)}
.find input:focus{outline:none;border-color:var(--acc)}
.hits{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--sur);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.28);max-height:70vh;overflow-y:auto}
.hits a{display:flex;justify-content:space-between;gap:12px;padding:7px 12px}
.hits a.sel,.hits a:hover{background:var(--bg);color:inherit}
.hits .none{padding:10px 12px;color:var(--mute)}
.fresh{margin-left:auto;color:var(--mute);font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.dot.stale{background:var(--warn)}.dot.dead{background:var(--down)}
.ico{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:15px}
.ico:hover{color:var(--fg)}
nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
nav a{padding:6px 0 10px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
nav a.on{color:var(--fg);border-color:var(--acc)}
nav a:hover{color:var(--fg)}
nav .end{margin-left:auto}

/* type and blocks */
main{padding-block:26px}
h1{font-size:20px;line-height:1.3;margin:0}
h2{font-size:14px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--mute)}.dim{color:var(--dim)}.small{font-size:12.5px}
.g{color:var(--gold)}.s{color:var(--silver)}.c{color:var(--copper)}
.money{white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.buy{color:var(--buy)}.sell{color:var(--sell)}
.q0{color:var(--q0)}.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}.q4{color:var(--q4)}.q5{color:var(--q5)}
.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:10px 14px;flex-wrap:wrap;margin-bottom:10px}
.sec-h .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note{color:var(--mute);font-size:12.5px;margin-top:10px;max-width:72ch}
.empty{color:var(--mute);padding:26px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 11px;cursor:pointer;color:var(--mute);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sur);color:var(--fg)}
.btn{background:var(--sur);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.inp{background:var(--sur);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-width:0}
.inp:focus{outline:none;border-color:var(--acc)}
.tag{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 6px;white-space:nowrap}

/* action rows (Today) */
.rows{border-top:1px solid var(--line)}
.arow{display:grid;grid-template-columns:54px minmax(0,1fr) auto auto 26px;gap:4px 14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.arow.done{opacity:.4}
.verb{font-weight:700;font-size:12.5px}
.arow .nm{font-weight:700;overflow-wrap:anywhere}
.arow .why{grid-column:2;color:var(--mute);font-size:12.5px;overflow-wrap:anywhere}
.arow .pr{text-align:right;grid-row:1;grid-column:3}
.arow .ago{color:var(--dim);font-size:12px;text-align:right;white-space:nowrap;grid-row:1;grid-column:4;min-width:52px}
.arow .ok{grid-row:1;grid-column:5;padding:0}
.arow .full{grid-column:2 / -1;color:var(--mute);font-size:12.5px;padding-top:2px}
.more{background:none;border:0;color:var(--mute);cursor:pointer;padding:10px 0}
.more:hover{color:var(--fg)}
details.fold{border-bottom:1px solid var(--line)}
details.fold:first-of-type{border-top:1px solid var(--line)}
details.fold>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:baseline;padding:11px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+";color:var(--dim);width:10px;flex:none}
details.fold[open]>summary::before{content:"−"}
details.fold>summary b{font-weight:700}
details.fold>summary .cnt{color:var(--mute)}
details.fold>summary .hint{color:var(--dim);font-size:12.5px;margin-left:auto;text-align:right}
details.fold>.in{padding:0 0 16px 22px}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 20px}
.facts dt{color:var(--mute)}
.facts dd{margin:0;overflow-wrap:anywhere}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 14px 8px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:baseline}
th:last-child,td:last-child{padding-right:0}
th{color:var(--mute);font-weight:400;font-size:12.5px;white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sur)}
tr.sub td{background:var(--sur);padding:12px 14px;border-bottom:1px solid var(--line)}
tr.mine td{font-weight:700}
.range{display:inline-block;position:relative;width:96px;height:10px;vertical-align:middle}
.range::before{content:"";position:absolute;left:0;right:0;top:4.5px;border-top:1px solid var(--dim)}
.range i{position:absolute;top:1px;width:1px;height:8px;background:var(--mute)}
.range b{position:absolute;top:1px;width:8px;height:8px;border-radius:50%;margin-left:-4px;background:var(--mute)}
.range b.lo{background:var(--buy)}.range b.hi{background:var(--sell)}

/* item page */
.back{color:var(--mute);display:inline-block;margin-bottom:14px}
.head{display:flex;gap:8px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.stats{display:flex;gap:14px 34px;flex-wrap:wrap;margin:18px 0 26px}
.stats div{min-width:0}
.stats i{display:block;font-style:normal;font-size:12.5px;color:var(--mute)}
.stats b{font-weight:400;font-size:17px}
.line{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.chart{width:100%;height:220px;display:block}
.chart text{fill:var(--mute);font-size:10.5px;font-family:var(--font)}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:1.6}
.chart .ar{fill:var(--acc);opacity:.07}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hv{stroke:var(--mute);stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--sur);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;z-index:5}
.rel{position:relative}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.cand:last-of-type{border-bottom:0}
.cand .src{grid-column:1 / -1}
.toast{position:fixed;right:16px;bottom:16px;background:var(--sur);border:1px solid var(--acc);border-radius:8px;padding:10px 14px;z-index:20;max-width:min(420px,calc(100vw - 32px))}
code{background:var(--sur);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
ol{padding-left:22px;margin:0}
@media(max-width:640px){
  .top{flex-wrap:wrap;gap:10px}
  .find{order:3;flex-basis:100%;max-width:none}
  .opt{display:none}
  nav{gap:16px;font-size:13.5px}
  .arow{grid-template-columns:46px minmax(0,1fr) auto 26px}
  .arow .ago{display:none}
  .arow .ok{grid-column:4}
  details.fold>summary .hint{display:none}
  details.fold>.in{padding-left:0}
}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="brand" href="#today"><i>&#xf0d6;</i>AH Desk</a>
    <div class="find"><input id="q" placeholder="Search any item  ( / )" autocomplete="off" spellcheck="false" aria-label="Search items"><div class="hits" id="hits" hidden></div></div>
    <div class="fresh" id="age"><span class="dot"></span>loading</div>
    <button class="ico" id="theme" title="Switch light / dark" aria-label="Switch theme">&#xf186;</button>
  </div>
  <div class="wrap"><nav id="nav">
    <a href="#today">Today</a>
    <a href="#market">Market</a>
    <a href="#char">Character</a>
    <a href="#plans">Professions</a>
    <a href="#setup" class="end">Settings</a>
  </nav></div>
</header>
<main class="wrap" id="view"><div class="empty">Loading…</div></main>
<div class="tip" id="tip" hidden></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("ahd." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ahd." + k, JSON.stringify(v)); } catch {} }
};
const S = { meta: null, now: null, feed: null, bank: null, plans: null, names: null, x: null, hist: null };
const DASH = '<span class="dim">–</span>';

// ---------- money and time
function money(c, plain) {
  if (c == null || isNaN(c)) return DASH;
  c = Math.round(c); const neg = c < 0; c = Math.abs(c);
  const g = Math.floor(c / 10000), s = Math.floor(c / 100) % 100, k = c % 100;
  if (plain) return (neg ? "-" : "") + (g ? `${g}g${s ? " " + s + "s" : ""}` : s ? `${s}s${k ? " " + k + "c" : ""}` : k + "c");
  let o = "";
  if (g) o += `${g}<span class="g">g</span> `;
  if (g || s) o += `${s}<span class="s">s</span> `;
  if (!g) o += `${k}<span class="c">c</span>`;
  return `<span class="money">${neg ? "-" : ""}${o.trim()}</span>`;
}
function parseMoney(t) {
  t = String(t).trim().toLowerCase().replace(",", "."); if (!t) return null;
  let c = 0, m, any = false;
  for (const [re, mul] of [[/([\d.]+)\s*g/, 10000], [/([\d.]+)\s*s/, 100], [/([\d.]+)\s*c/, 1]]) if ((m = t.match(re))) { c += parseFloat(m[1]) * mul; any = true; }
  if (!any && /^[\d.]+$/.test(t)) c = parseFloat(t) * 100; // bare number = silver
  return Math.round(c) || null;
}
const M = t => parseMoney(String(t || "").replace(/^~/, ""));
const pct = (a, b) => (a == null || !b) ? null : Math.round(100 * a / b - 100);
const pctHtml = p => p == null ? DASH : `<span class="${p > 0 ? "up" : p < 0 ? "down" : "muted"}">${p > 0 ? "+" : ""}${p}%</span>`;
const tr = ts => new Date(ts.endsWith("Z") ? ts : ts + "Z");
const fmtTime = d => d.toLocaleTimeString("tr-TR", {hour: "2-digit", minute: "2-digit", timeZone: "Europe/Istanbul"});
const fmtDay = d => d.toLocaleDateString("en-GB", {day: "numeric", month: "short", weekday: "short", timeZone: "Europe/Istanbul"});
const qcls = q => { const m = {POOR:0,COMMON:1,UNCOMMON:2,RARE:3,EPIC:4,LEGENDARY:5}; const v = typeof q === "number" ? q : m[String(q || "").toUpperCase()]; return v == null ? "" : "q" + v; };
function ago(d) { const m = Math.max(0, Math.round((Date.now() - d) / 60000)); return m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; }
const itemLink = (id, name, q) => id ? `<a href="#item-${id}" class="${qcls(q ?? S.now.items[id]?.q)}">${esc(name)}</a>` : esc(name);

// ---------- data
async function getJSON(p) { const r = await fetch(`data/${p}?v=${Date.now()}`, {cache: "no-store"}); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }
async function loadCore() {
  const [meta, now, feed, bank, plans, names] = await Promise.all(["meta.json", "now.json", "feed.json", "bank.json", "plans.json", "names.json"].map(getJSON));
  Object.assign(S, {meta, now, feed, bank, plans, names});
  S.byName = {}; for (const [id, n] of Object.entries(names)) S.byName[n.toLowerCase()] = id;
  S.x = null; S.hist = null;
}
async function loadBig() {
  if (!S.x) S.x = await getJSON("x.json");
  if (!S.hist) S.hist = await getJSON("hist.json");
}
function renderAge() {
  const el = $("#age"); if (!S.meta) return;
  const d = tr(S.meta.fetched), mins = Math.round((Date.now() - d) / 60000);
  const cls = mins > 150 ? "dead" : mins > 80 ? "stale" : "";
  el.title = `Auction data from ${fmtTime(d)}. Blizzard publishes a new scan about once an hour.`;
  el.innerHTML = `<span class="dot ${cls}"></span>${fmtTime(d)}<span class="opt">&nbsp;(${mins < 120 ? mins + " min ago" : Math.round(mins / 60) + " h ago"})</span>`;
}

// ---------- router
const VIEWS = {today: vToday, feed: vToday, market: vMarket, watch: () => vMarket("watch"), bank: () => vMarket("stock"), search: vMarket,
  char: vChar, db: () => vChar("db"), plans: vPlans, setup: vSetup};
const NAVOF = {feed: "today", watch: "market", bank: "market", search: "market", db: "char", item: "market"};
function route() {
  const h = (location.hash || "#today").slice(1);
  const isItem = h.startsWith("item-"), name = isItem ? "item" : h;
  const navName = NAVOF[name] || name;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + navName));
  $("#view").onclick = $("#view").onchange = $("#view").oninput = null;
  if (isItem) vItem(h.slice(5)); else (VIEWS[name] || vToday)();
  window.scrollTo(0, 0);
}

// ---------- header search
(function () {
  const q = $("#q"), box = $("#hits"); let sel = 0, hits = [];
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    if (t.length < 2 || !S.names) { box.hidden = true; return; }
    hits = [];
    for (const [id, n] of Object.entries(S.names)) { const l = n.toLowerCase(), i = l.indexOf(t); if (i >= 0) hits.push([id, n, (i === 0 ? 0 : 1) + (S.now.items[id] ? 0 : 2), n.length]); }
    hits.sort((a, b) => a[2] - b[2] || a[3] - b[3]); hits = hits.slice(0, 12); sel = Math.min(sel, Math.max(0, hits.length - 1));
    box.innerHTML = hits.length ? hits.map(([id, n], i) => { const it = S.now.items[id];
      return `<a href="#item-${id}" class="${i === sel ? "sel" : ""}"><span class="${qcls(it?.q)}">${esc(n)}</span><span>${it ? money(it.min) : '<span class="dim">not listed</span>'}</span></a>`; }).join("") : '<div class="none">No item with that name.</div>';
    box.hidden = false;
  };
  q.oninput = () => { sel = 0; draw(); };
  q.onfocus = draw;
  q.onkeydown = e => {
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, hits.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && hits[sel]) { location.hash = "#item-" + hits[sel][0]; q.blur(); box.hidden = true; }
    else if (e.key === "Escape") { q.blur(); box.hidden = true; }
  };
  document.addEventListener("click", e => { if (!e.target.closest(".find")) box.hidden = true; else if (e.target.closest(".hits a")) { box.hidden = true; q.value = ""; } });
  document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); } });
})();

// ---------- stock (what you hold): server list + counts saved in this browser
function holdings() {
  const local = LS.get("holdings", {}) || {}, out = [], seen = new Set();
  for (const b of S.bank || []) { seen.add(b.n); const cnt = local[b.n] != null ? local[b.n] : b.cnt; if (cnt > 0) out.push({...b, cnt}); }
  for (const [n, cnt] of Object.entries(local)) {
    if (seen.has(n) || !(cnt > 0)) continue;
    const id = S.byName[n.toLowerCase()], it = id && S.now.items[id];
    out.push({id, n, cnt, min: it?.min, qty: it?.qty, m7: it?.m7, lo30: it?.lo30, hi30: it?.hi30, sp: it?.sp});
  }
  return out;
}
function heldCount(id) { const h = holdings().find(b => String(b.id) === String(id)); return h ? h.cnt : 0; }
function setHeld(name, cnt) { const h = LS.get("holdings", {}) || {}; h[name] = Math.max(0, parseInt(cnt) || 0); LS.set("holdings", h); }

// position of the current price inside its 30-day range, with the 7-day median as a tick
function rangeBar(it) {
  if (!it || it.min == null || it.lo30 == null || it.hi30 == null) return "";
  const lo = Math.min(it.lo30, it.min), hi = Math.max(it.hi30, it.min), span = hi - lo || 1;
  const pos = (it.min - lo) / span, med = it.m7 != null ? Math.min(1, Math.max(0, (it.m7 - lo) / span)) : null;
  return `<span class="range" title="30-day range ${money(lo, 1)} to ${money(hi, 1)}. Tick: 7-day median."><i style="left:${med == null ? -99 : (med * 100).toFixed(0)}%"></i><b class="${pos <= 0.25 ? "lo" : pos >= 0.75 ? "hi" : ""}" style="left:${(pos * 100).toFixed(0)}%"></b></span>`;
}
// A single cheap listing misleads. Lot price = average cost of the cheapest 5% of what is listed (20 to 200 units).
function lotOf(it) {
  if (!it || !it.lv || !it.lv.length) return null;
  const lot = Math.max(20, Math.min(200, Math.round((it.qty || 0) * 0.05))); let got = 0, tot = 0;

    if (!ok.has(d.sl) || d.rq > maxReq || d.rnd || (other && other.id === id) || eq[slot]?.id === id) continue;
    if (slot === "MAIN_HAND" && d.sl === "2H" && eq.OFF_HAND?.id) continue;
    if (slot === "MAIN_HAND" && d.sl !== "2H" && !eq.OFF_HAND?.id && S.db.items[eq.MAIN_HAND?.id]?.sl === "2H") continue;
    const v = VAL(d, slot === "OFF_HAND");
    if (v > cur) out.push([id, d, v]);
  }
  return out.sort((a, b) => b[2] - a[2]);
}
function srcHtml(d, sep = "<br>") {
  const s = (d.src || []).map(esc); if (d.ah) s.push(`auction house ${money(d.ah)}`);
  return s.length ? s.join(sep) : '<span class="dim">source unknown</span>';
}
const srcShort = d => d.ah ? `Auction house ${money(d.ah)}` : d.src?.length ? esc(d.src[0].length > 44 ? d.src[0].slice(0, 42) + "…" : d.src[0]) : '<span class="dim">unknown</span>';
async function vChar(tab) {
  if (tab !== "db") tab = "gear";
  $("#view").innerHTML = `<div class="empty">Loading…</div>`;
  await loadDB();
  const c = S.char, lvl = c?.level || S.db.level;
  const tabsHtml = `<div class="seg">${[["gear", "Gear"], ["db", "All items"]].map(([k, l]) => `<button data-ctab="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const specHtml = `<div class="seg">${[["bm", "Beast Mastery"], ["surv", "Survival"]].map(([k, l]) => `<button data-spec="${k}" class="${SPEC() === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const head = `<div class="sec-h"><h1>${esc(c?.name || "Character")}</h1><span class="muted">level ${lvl} ${esc(c?.race || "")} ${esc(c?.className || "")}</span><div class="right">${specHtml}${tabsHtml}</div></div>`;
  if (tab === "db") return vDB(head);
  const eq = equipped(), total = Object.values(eq).reduce((a, e) => a + (e.v || 0), 0) || 1, reach = LS.get("reach", 0);
  const st = c?.stats;
  let html = `<section class="sec">${head}
    ${st ? `<div class="stats">${[["Health", st.health], ["Attack power", st.attackPower], ["Agility", st.agility], ["Stamina", st.stamina], ["Ranged crit", st.rangedCrit + "%"], ["Melee crit", st.meleeCrit + "%"], ["Armor", st.armor]].map(([k, v]) => `<div><i>${k}</i><b>${v}</b></div>`).join("")}</div>` : ""}
    <div class="sec-h"><h2>Gear and best upgrades</h2><div class="right"><span class="muted small">Upgrades usable at</span><div class="seg">${[0, 3, 5, 10].map(r => `<button data-reach="${r}" class="${reach === r ? "on" : ""}">${r ? "level " + (lvl + r) : "now"}</button>`).join("")}</div></div></div>
    <div class="tbl"><table><tr><th>Slot</th><th>Equipped</th><th>Best upgrade</th><th class="r">Gain</th><th class="opt">Where</th></tr>`;
  for (const [sl, label] of SLOTS) {
    const e = eq[sl] || {}, cand = candidates(sl, eq, lvl + reach), b = cand[0];
    const gain = b ? Math.round(1000 * (b[2] - (e.v || 0)) / total) / 10 : null;
    html += `<tr class="click" data-open="${sl}"><td class="muted">${label}</td>
      <td>${e.id ? `<span class="${qcls(e.q)}">${esc(e.name || S.db.items[e.id]?.n || "#" + e.id)}</span>` : '<span class="dim">empty</span>'}${e.v == null && e.id ? ' <span class="warn" title="Random-suffix item: open the row and type its stats">?</span>' : ""}</td>
      <td>${b ? `<span class="${qcls(b[1].q)}">${esc(b[1].n)}</span>` : '<span class="dim">nothing better</span>'}</td>
      <td class="r">${gain != null ? `<span class="up">+${gain}%</span>` : ""}</td><td class="opt muted small">${b ? srcShort(b[1]) : ""}</td></tr>
      <tr class="sub" id="open-${sl}" hidden><td colspan="5">
        <p class="small"><span class="muted">Equipped:</span> ${e.id ? `<a href="#item-${e.id}">${esc(e.name || "")}</a> ${esc(e.st || "")}` : "nothing"}${e.src === "manual" ? ' <span class="tag">edited by you</span>' : ""}</p>
        <div style="margin:8px 0 12px">${cand.slice(0, 8).map(([id, d, v]) => `<div class="cand"><span><a href="#item-${id}" class="${qcls(d.q)}">${esc(d.n)}</a> <span class="tag">level ${d.rq}</span> <span class="muted small">${esc(d.st)}</span></span><span class="up">+${Math.round(1000 * (v - (e.v || 0)) / total) / 10}%</span><span class="src muted small">${srcHtml(d, ", ")}</span></div>`).join("") || '<span class="muted small">No better item in the database for this level.</span>'}</div>
        <div class="line"><span class="muted small">Wearing something else?</span><input class="inp" style="width:230px" placeholder="item name" data-pick="${sl}" list="dl-${sl}" aria-label="Item name">
          <input class="inp" style="width:230px" placeholder="or stats: +6 agi +14 sta" data-stats="${sl}" value="${esc(LS.get("eq", {})[sl]?.stats || "")}" aria-label="Stats">
          <button class="btn" data-save="${sl}">Save</button>${e.src === "manual" ? `<button class="btn" data-reset="${sl}">Use armory data</button>` : ""}</div></td></tr>`;
  }
  html += `</table></div><p class="note">Click a slot for more candidates, sources and to correct what you wear. Gain is the share of your total gear value under ${SPEC() === "bm" ? "Beast Mastery weights (ranged damage and Agility first, Intellect counts through Careful Aim)" : "Survival weights (melee damage, Agility, Stamina and Hit)"}. Armory data is from your last logout${c?.lastLogin ? ", " + fmtDay(new Date(c.lastLogin)) + " " + fmtTime(new Date(c.lastLogin)) : ""}.</p></section>`;
  $("#view").innerHTML = html;
  $("#view").onclick = e => {
    const t = e.target.closest("button");
    if (t) {
      if (t.dataset.ctab) return vChar(t.dataset.ctab);
      if (t.dataset.reach != null) { LS.set("reach", +t.dataset.reach); return vChar(); }
      if (t.dataset.spec) { LS.set("spec", t.dataset.spec); return vChar(); }
      if (t.dataset.save) { const sl = t.dataset.save, ov = LS.get("eq", {}), nmv = $(`[data-pick="${sl}"]`).value.trim(), sv = $(`[data-stats="${sl}"]`).value.trim();
        const hit = nmv && Object.entries(S.db.items).find(([, d]) => d.n.toLowerCase() === nmv.toLowerCase());
        const base = hit ? {id: hit[0], name: hit[1].n, q: hit[1].q} : (eq[sl] ? {id: eq[sl].id, name: eq[sl].name, q: eq[sl].q} : {});
        ov[sl] = {...base, ...(sv ? {stats: sv} : {})}; LS.set("eq", ov); return vChar(); }
      if (t.dataset.reset) { const ov = LS.get("eq", {}); delete ov[t.dataset.reset]; LS.set("eq", ov); return vChar(); }
      return;
    }
    const row = e.target.closest("tr[data-open]"); if (!row || e.target.closest("a,input")) return;
    const sl = row.dataset.open, sub = $("#open-" + sl); sub.hidden = !sub.hidden;
    if (!sub.hidden && !$("#dl-" + sl)) { const dl = document.createElement("datalist"); dl.id = "dl-" + sl;
      dl.innerHTML = Object.values(S.db.items).filter(d => SLOTS.find(s => s[0] === sl)[2].includes(d.sl)).slice(0, 2500).map(d => `<option value="${esc(d.n)}">`).join(""); sub.appendChild(dl); }
  };
}
const SRCF = {all: "Any source", boss: "Dungeon drop", quest: "Quest", craft: "Crafted", rep: "Reputation", ah: "On the auction house"};
function vDB(head) {
  const lvl = S.char?.level || S.db.level, f = LS.get("dbf", {q: "", sl: "", mx: lvl + 5, src: "all"});
  const slots = [...new Set(Object.values(S.db.items).map(d => d.sl))].sort();
  $("#view").innerHTML = `<section class="sec">${head}<div class="line" style="margin-bottom:14px">
    <input class="inp" style="flex:1;min-width:180px" id="fq" placeholder="Filter by name, stat or dungeon" value="${esc(f.q)}" aria-label="Filter">
    <select class="inp" id="fsl" aria-label="Slot"><option value="">Any slot</option>${slots.map(s => `<option ${s === f.sl ? "selected" : ""}>${s}</option>`).join("")}</select>
    <select class="inp" id="fsrc" aria-label="Source">${Object.entries(SRCF).map(([k, v]) => `<option value="${k}" ${k === f.src ? "selected" : ""}>${v}</option>`).join("")}</select>
    <label class="muted small" for="fmx">up to level</label><input class="inp" style="width:64px" id="fmx" type="number" value="${f.mx}"></div><div id="dbt"></div></section>`;
  const draw = () => {
    const q = $("#fq").value.trim().toLowerCase(), sl = $("#fsl").value, mx = +$("#fmx").value || 60, src = $("#fsrc").value;
    LS.set("dbf", {q, sl, mx, src});
    const rows = Object.entries(S.db.items).filter(([, d]) => (!sl || d.sl === sl) && d.rq <= mx
      && (src === "all" || (src === "ah" ? d.ah : (d.src || []).some(x => x.toLowerCase().startsWith({boss: "drop", quest: "quest", craft: "craft", rep: "rep"}[src]) || (src === "quest" && x.startsWith("Dungeon quest")))))
      && (!q || (d.n + " " + d.st + " " + (d.src || []).join(" ") + " " + d.ty).toLowerCase().includes(q)))
      .sort((a, b) => VAL(b[1], b[1].sl === "OH") - VAL(a[1], a[1].sl === "OH"));
    $("#dbt").innerHTML = rows.length ? `<div class="tbl"><table><tr><th>Item</th><th class="opt">Slot</th><th class="r">Level</th><th>Stats</th><th class="r">Value</th><th class="opt">Where</th></tr>${rows.slice(0, 150).map(([id, d]) =>
      `<tr><td><a href="#item-${id}" class="${qcls(d.q)}">${esc(d.n)}</a>${d.rnd ? ' <span class="tag">random stats</span>' : ""}</td><td class="opt muted">${esc(d.sl)}</td><td class="r">${d.rq}</td>
       <td class="small muted">${esc(d.st)}</td><td class="r">${VAL(d)}</td><td class="opt small muted">${srcShort(d)}</td></tr>`).join("")}</table></div>
      <p class="note">${rows.length > 150 ? `Best 150 of ${rows.length} by value. Narrow the filter to see the rest.` : `${rows.length} items, best value first.`} Value uses the spec chosen above.</p>` : `<p class="empty">No item matches. Loosen the filter.</p>`;

    if (t.dataset.ctab) return vChar(t.dataset.ctab); if (t.dataset.spec) { LS.set("spec", t.dataset.spec); return vChar("db"); } };
  draw();
}

// ---------- chart
function chart(el, pts) {
  const W = el.clientWidth || 600, H = 220, P = {l: 62, r: 10, t: 10, b: 24};
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const sorted = [...ys].sort((a, b) => a - b), cap = sorted[Math.floor(sorted.length * 0.97)] * 1.15;
  const y0 = 0, y1 = Math.max(1, Math.min(Math.max(...ys), cap));
  const X = v => P.l + (v - x0) / (x1 - x0 || 1) * (W - P.l - P.r), Y = v => H - P.b - (Math.min(v, y1) - y0) / (y1 - y0) * (H - P.t - P.b);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y1 * i / 4, y = Y(v); g += `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text x="${P.l - 6}" y="${y + 3}" text-anchor="end">${money(v, 1).replace(/ 0c$/, "")}</text>`; }
  const days = Math.ceil((x1 - x0) / 24);
  for (let h = Math.ceil(x0 / 24) * 24; h <= x1; h += 24 * Math.max(1, Math.ceil(days / 8))) { const x = X(h); g += `<text x="${x}" y="${H - 6}" text-anchor="middle">${new Date(h * 3600e3).toLocaleDateString("en-GB", {day: "numeric", month: "short"})}</text>`; }
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history">${g}<path class="ar" d="${d}L${X(x1)},${Y(0)}L${X(x0)},${Y(0)}Z"/><path class="ln" d="${d}"/><line class="hv" id="hv" y1="${P.t}" y2="${H - P.b}" visibility="hidden"/></svg>`;
  const svg = el.querySelector("svg"), tip = $("#tip"), hv = el.querySelector("#hv");
  svg.onpointermove = e => {
    const r = svg.getBoundingClientRect(), xv = x0 + ((e.clientX - r.left) * W / r.width - P.l) / (W - P.l - P.r) * (x1 - x0);
    let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - xv) < Math.abs(best[0] - xv)) best = p;
    hv.setAttribute("x1", X(best[0])); hv.setAttribute("x2", X(best[0])); hv.setAttribute("visibility", "visible");
    const dt = new Date(best[0] * 3600e3);
    tip.innerHTML = `${fmtDay(dt)} ${fmtTime(dt)}, ${money(best[1])}`; tip.hidden = false;
    tip.style.left = Math.min(e.pageX + 12, document.documentElement.clientWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.pageY - 34) + "px";
  };
  svg.onpointerleave = () => { tip.hidden = true; hv.setAttribute("visibility", "hidden"); };
}

// ---------- professions
function vPlans() {
  const routes = (S.feed.status || []).map(l => l && l.match(/^(\w+) route: (.*?) now \(7d low (.*?)\)/)).filter(Boolean);
  let html = `<section class="sec"><div class="sec-h"><h1>Professions</h1></div>`;
  html += S.plans.map((p, i) => `<details class="fold" data-fold="plan${i}" ${LS.get("fold.plan" + i, i === 0) ? "open" : ""}><summary><b>${esc(p.title)}</b><span class="cnt">${money(p.net)} net</span><span class="hint">${p.missing.length ? '<span class="warn">short on the auction house</span>' : `${money(p.total, 1)} mats, ${money(p.back, 1)} back from vendor`}</span></summary><div class="in">
    ${p.missing.length ? `<p class="warn small" style="margin-bottom:10px">Not enough listed: ${p.missing.map(esc).join(", ")}</p>` : ""}
    <div class="tbl"><table><tr><th>Buy</th><th class="r">Quantity</th><th class="r">Each</th><th class="r opt">7-day</th><th class="r">Total</th></tr>
    ${p.shop.map(s => { const id = S.byName[s.n.toLowerCase()]; return `<tr><td>${id ? `<a href="#item-${id}">${esc(s.n)}</a>` : esc(s.n)}${s.src === "vendor" ? ' <span class="tag">vendor</span>' : ""}</td><td class="r">${s.qty}${s.got < s.qty && s.src !== "vendor" ? ` <span class="warn">(${s.got} listed)</span>` : ""}</td><td class="r">${money(s.unit)}</td><td class="r opt">${money(s.m7)}</td><td class="r">${money(s.cost)}</td></tr>`; }).join("")}</table></div>
    <div class="tbl" style="margin-top:18px"><table><tr><th>Skill</th><th>Craft</th><th class="r">Times</th><th class="opt">Mats per craft</th></tr>
    ${p.steps.map(s => `<tr><td>${s.range}</td><td>${esc(s.recipe)}</td><td class="r">${s.n}</td><td class="muted small opt">${Object.entries(s.mats).map(([m, q]) => `${q} ${esc(m)}`).join(", ")}</td></tr>`).join("")}</table></div></div></details>`).join("");
  html += `</section>`;
  if (routes.length) html += `<section class="sec"><div class="sec-h"><h2>Full route cost at today's prices</h2></div><div class="tbl"><table><tr><th>Route</th><th class="r">Now</th><th class="r">7-day low</th></tr>
    ${routes.map(m => `<tr><td>${esc(m[1])}</td><td class="r">${M(m[2]) ? money(M(m[2])) : DASH}</td><td class="r">${M(m[3]) ? money(M(m[3])) : DASH}</td></tr>`).join("")}</table></div>
    <p class="note">Raw materials for the whole route, bought at current depth. Wait for a day near the 7-day low before starting.</p></section>`;
  $("#view").innerHTML = html;
  $("#view").onclick = e => { const sm = e.target.closest("details.fold > summary"); if (sm) setTimeout(() => LS.set("fold." + sm.parentNode.dataset.fold, sm.parentNode.open), 0); };
}

// ---------- settings
function vSetup() {
  const topic = S.meta.ntfy, perm = "Notification" in window ? Notification.permission : "unsupported";
  $("#view").innerHTML = `<section class="sec"><div class="sec-h"><h1>Settings</h1></div><dl class="facts">
    <dt>Discord</dt><dd>Short messages for sell, buy, gear, snipe and Favor alerts, plus a status at 09:00 and 21:00.</dd>
    <dt>Phone</dt><dd>${topic ? `Install the ntfy app, add the topic <code>${esc(topic)}</code> <button class="btn" id="cp">Copy</button> and subscribe.` : "Not set up."}</dd>
    <dt>This browser</dt><dd>${perm === "granted" ? "Alerts are on while this page is open." : perm === "unsupported" ? "This browser cannot show notifications." : `<button class="btn" id="notif">Turn on alerts</button> for new opportunities and watch targets while this page is open.`}</dd>
    <dt>Data</dt><dd>${S.meta.items} items on our auction house${S.meta.markets ? `, ${S.meta.markets} Forever markets` : ""}. Blizzard publishes a scan about once an hour; this page checks every 3 minutes. History goes back to server launch.</dd>
    <dt>Saved here</dt><dd>Watch targets, stock counts, gear corrections and done marks live only in this browser.</dd></dl></section>`;
  $("#view").onclick = async e => {

    if (e.target.id === "notif") { await Notification.requestPermission(); if (Notification.permission === "granted") notify("Alerts on", "New opportunities will show up here."); vSetup(); }
  };

// ---------- notifications and refresh
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 4500); }
function notify(title, body, tag) { try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, {body, tag}); } catch {} }
function checkNew(prevTs) {
  const fresh = S.feed.items.filter(a => prevTs && a.ts > prevTs && NOW_KINDS.includes(a.k));
  if (fresh.length) notify(`${fresh.length} new to act on`, fresh.slice(0, 4).map(a => a.t).join("\n"), "feed-" + fresh[0].ts);
  const w = LS.get("watch", {}), fired = LS.get("watchFired", {});
  for (const [id, v] of Object.entries(w)) { const it = S.now.items[id];
    if (it && it.min <= v.t && fired[id] !== S.meta.fetched) { notify(`${v.n} reached your target`, `${money(it.min, 1)} (target ${money(v.t, 1)}), ${it.qty} listed`, "w" + id); fired[id] = S.meta.fetched; } }
  LS.set("watchFired", fired);
}
async function poll() {
  try {
    const m = await getJSON("meta.json");
    if (!S.meta || m.built !== S.meta.built) {
      const prev = S.feed?.items[0]?.ts; await loadCore(); checkNew(prev);
      if (!/INPUT|SELECT/.test(document.activeElement.tagName)) route();
    }
  } catch (e) { console.warn(e); }
  renderAge();
}
const th = LS.get("theme", null); if (th) document.documentElement.dataset.theme = th;
$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); const n = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; LS.set("theme", n); };
window.addEventListener("hashchange", route);
(async () => {
  try { await loadCore(); } catch (e) { $("#view").innerHTML = `<p class="empty">Could not load data (${esc(e.message)}). Reload the page in a minute.</p>`; return; }
  renderAge(); route(); checkNew(LS.get("seenTs", ""));
  setInterval(poll, 180000); setInterval(renderAge, 60000);
})();
